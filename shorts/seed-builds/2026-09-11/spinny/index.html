<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>spinny</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#14161c;touch-action:none;
    user-select:none;-webkit-user-select:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let vw, vh, cx, cy, R;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = vw / 2; cy = vh / 2; R = Math.min(vw, vh) * 0.3;
}
resize();
addEventListener("resize", resize);

let ang = 0, om = 0, drag = null, hint = 1, brakeFlash = 0, peak = 0;
const pAng = e => Math.atan2(e.clientY - cy, e.clientX - cx);
const norm = a => Math.atan2(Math.sin(a), Math.cos(a));

cv.addEventListener("pointerdown", e => {
  const d = Math.hypot(e.clientX - cx, e.clientY - cy);
  if (d < R * 0.3){ om *= 0.3; brakeFlash = 1; return; }          // bearing = brake
  drag = { a: pAng(e), t: performance.now(), samples: [] };
  cv.setPointerCapture(e.pointerId);
  hint = 0;
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const a = pAng(e), t = performance.now();
  const da = norm(a - drag.a), dt = Math.max(1, t - drag.t) / 1000;
  ang += da; om = 0;
  drag.samples.push({ w: da / dt, t });
  if (drag.samples.length > 8) drag.samples.shift();
  drag.a = a; drag.t = t;
});
function release(){
  if (!drag) return;
  const now = performance.now();
  const recent = drag.samples.filter(s => now - s.t < 110);
  om = recent.length ? recent.reduce((s, x) => s + x.w, 0) / recent.length : 0;
  om = Math.max(-110, Math.min(110, om));
  drag = null;
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

function arm(a, r, alpha){
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(a); ctx.globalAlpha = alpha;
  const speed = Math.min(1, Math.abs(om) / 60);
  const hue = 195 + speed * 130;
  for (let i = 0; i < 3; i++){
    ctx.rotate(Math.PI * 2 / 3);
    ctx.strokeStyle = `hsl(${hue},70%,52%)`;
    ctx.lineCap = "round"; ctx.lineWidth = r * 0.36;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -r * 0.7); ctx.stroke();
    ctx.fillStyle = `hsl(${hue},70%,58%)`;
    ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = "#14161c";
    ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.16, 0, 7); ctx.fill();
    ctx.fillStyle = `hsl(${hue},40%,80%)`;
    ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.06, 0, 7); ctx.fill();
  }
  ctx.restore();
}

let last = performance.now(), t = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (!drag){
    const dec = (0.35 + Math.abs(om) * 0.09) * dt;
    om = Math.abs(om) <= dec ? 0 : om - Math.sign(om) * dec;
    ang += om * dt;
  }
  peak = Math.max(peak, Math.abs(om));
  if (brakeFlash > 0) brakeFlash = Math.max(0, brakeFlash - dt * 3);

  ctx.fillStyle = "#14161c"; ctx.fillRect(0, 0, vw, vh);
  // floor glow scales with speed
  const speed = Math.min(1, Math.abs(om) / 60);
  const g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.9);
  g.addColorStop(0, `hsla(${195 + speed * 130},70%,50%,${0.08 + speed * 0.22})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);

  // motion-blur ghosts
  if (Math.abs(om) > 5){
    for (let i = 3; i >= 1; i--) arm(ang - om * 0.012 * i, R, 0.12 * (4 - i) * speed);
  }
  arm(ang, R, 1);

  // bearing
  ctx.fillStyle = "#e8e6df";
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.3, 0, 7); ctx.fill();
  ctx.fillStyle = "#c9c6bc";
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.22, 0, 7); ctx.fill();
  ctx.fillStyle = "#14161c";
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.09, 0, 7); ctx.fill();
  if (brakeFlash > 0){
    ctx.strokeStyle = `rgba(255,255,255,${brakeFlash})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.3 + (1 - brakeFlash) * 30, 0, 7); ctx.stroke();
  }

  // readout
  const rpm = Math.abs(om) / (Math.PI * 2) * 60;
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.font = "700 40px ui-monospace,monospace";
  ctx.fillText(String(Math.round(rpm)), cx, vh - 44);
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.font = "500 12px ui-monospace,monospace";
  ctx.fillText(`rpm  ·  best ${Math.round(peak / (Math.PI * 2) * 60)}`, cx, vh - 22);
  if (hint){
    ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.35 * Math.sin(t * 4)})`;
    ctx.font = "500 15px ui-monospace,monospace";
    ctx.fillText("grab an arm and flick", cx, 44);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
