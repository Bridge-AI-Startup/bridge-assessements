<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>luna hop</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#151129;touch-action:none;
    user-select:none;-webkit-user-select:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let vw, vh, stars = [], craters = [];
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = [];
  for (let i = 0; i < 90; i++)
    stars.push({ x: Math.random() * vw, y: Math.random() * vh * 0.7, r: Math.random() * 1.6 + 0.4, tw: Math.random() * 6 });
}
resize();
addEventListener("resize", resize);

// planet geometry (recomputed each frame so resize stays correct)
const geom = () => {
  const R = Math.max(190, Math.min(vh * 0.62, vw * 0.7));
  return { R, cx: vw / 2, cy: vh + R * 0.42 };
};
const PA = -Math.PI / 2;   // player screen angle (top of planet)

let W, rotSpeed, h, hv, rocks, nextRockAt, score, state, t, best = 0;

function reset(){
  W = 0; rotSpeed = 0.55; h = 0; hv = 0;
  rocks = []; nextRockAt = 1.6; score = 0; t = 0;
  craters = [];
  for (let i = 0; i < 14; i++)
    craters.push({ a: Math.random() * Math.PI * 2, d: 0.25 + Math.random() * 0.6, r: 6 + Math.random() * 16 });
  state = "play";
}
function jump(){
  if (state === "over"){ reset(); return; }
  if (h === 0){ hv = 340; }
}
addEventListener("pointerdown", jump);
addEventListener("keydown", e => {
  if (e.code === "Space" && !e.repeat){ e.preventDefault(); jump(); }
});

function norm(a){
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  t += dt;
  const { R, cx, cy } = geom();

  if (state === "play"){
    rotSpeed = Math.min(1.25, rotSpeed + dt * 0.012);
    W += rotSpeed * dt;

    // jump physics
    if (h > 0 || hv > 0){
      h += hv * dt;
      hv -= 900 * dt;
      if (h <= 0){ h = 0; hv = 0; }
    }
    // spawn rocks ahead (screen angle = a - W; player at PA)
    if (W >= nextRockAt - 2.4){
      const a = W + PA + 2.4;                 // enters 2.4 rad ahead of player
      rocks.push({ a, h: 22 + Math.random() * 14, passed: false });
      nextRockAt += 1.15 + Math.random() * 1.15;
    }
    // collide / score
    for (const r of rocks){
      const s = norm(r.a - W - PA);           // 0 = at player
      if (!r.passed && s < -0.14){ r.passed = true; score++; }
      if (Math.abs(s) < 0.085 && h < r.h - 4){
        state = "over"; best = Math.max(best, score);
      }
    }
    rocks = rocks.filter(r => norm(r.a - W - PA) > -Math.PI * 0.8);
  }

  // ---- draw ----
  const g = ctx.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, "#100c22");
  g.addColorStop(0.72, "#2b1b3d");
  g.addColorStop(1, "#4a2b46");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, vw, vh);

  for (const s of stars){
    const a = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.4 + s.tw));
    ctx.fillStyle = `rgba(255,244,224,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // planet
  ctx.fillStyle = "#241d38";
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,220,190,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  // craters rotate with the world
  for (const c of craters){
    const a = c.a - W;
    const rr = R * (1 - c.d * 0.12);
    const x = cx + Math.cos(a) * rr * c.d, y = cy + Math.sin(a) * rr * c.d;
    if (y < vh + 20){
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath(); ctx.arc(x, y, c.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // rocks on the surface
  for (const r of rocks){
    const a = r.a - W;
    const bx = cx + Math.cos(a) * R, by = cy + Math.sin(a) * R;
    const tx = cx + Math.cos(a) * (R + r.h), ty = cy + Math.sin(a) * (R + r.h);
    const px2 = -Math.sin(a), py2 = Math.cos(a);   // tangent
    ctx.fillStyle = "#8f8496";
    ctx.beginPath();
    ctx.moveTo(bx + px2 * 11, by + py2 * 11);
    ctx.lineTo(bx - px2 * 11, by - py2 * 11);
    ctx.lineTo(tx, ty);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1; ctx.stroke();
  }

  // player (little astronaut) at top of planet
  const pr = R + 10 + h;
  const px = cx + Math.cos(PA) * pr, py = cy + Math.sin(PA) * pr;
  if (h > 0){
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(px, py + 12); ctx.lineTo(px, cy - R - 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle = "#f4f1ea";
  ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a3f5c";
  ctx.beginPath(); ctx.arc(px + 2, py - 2, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.arc(px + 3.5, py - 3.5, 1.6, 0, Math.PI * 2); ctx.fill();

  // score
  ctx.fillStyle = "rgba(255,244,224,0.95)";
  ctx.font = "700 46px ui-monospace,monospace";
  ctx.textAlign = "center";
  ctx.fillText(String(score), vw / 2, 62);

  if (state === "play" && score === 0 && W < 3){
    ctx.fillStyle = `rgba(255,244,224,${0.6 + 0.4 * Math.sin(t * 4)})`;
    ctx.font = "500 15px ui-monospace,monospace";
    ctx.fillText("tap to hop over the rocks", vw / 2, 100);
  }
  if (state === "over"){
    ctx.fillStyle = "rgba(16,12,34,0.72)";
    ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = "#f4f1ea";
    ctx.font = "700 30px ui-monospace,monospace";
    ctx.fillText("tripped on a rock", vw / 2, vh * 0.4);
    ctx.font = "500 17px ui-monospace,monospace";
    ctx.fillStyle = "rgba(255,244,224,0.9)";
    ctx.fillText(`hopped ${score}   ·   best ${best}`, vw / 2, vh * 0.4 + 36);
    ctx.fillStyle = `rgba(255,244,224,${0.6 + 0.4 * Math.sin(t * 4)})`;
    ctx.font = "500 15px ui-monospace,monospace";
    ctx.fillText("tap for another lap", vw / 2, vh * 0.4 + 72);
  }
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  if (vw > 0 && vh > 0){ reset(); requestAnimationFrame(frame); }
  else requestAnimationFrame(boot);
}
boot();
</script>
</body>
</html>
