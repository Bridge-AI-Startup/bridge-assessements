<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>stacktile</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1122;touch-action:none;
    user-select:none;-webkit-user-select:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let vw, vh;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener("resize", resize);

const BH = 26;               // block height
let blocks, cur, shards, state, score, camY, camTarget, t, flash, hintA, shake, best = 0;

function reset(){
  blocks = [{ x: 0, w: Math.min(170, vw * 0.5) }];
  shards = [];
  score = 0; camY = 0; camTarget = 0; t = 0; flash = 0; hintA = 1; shake = 0;
  state = "play";
  spawn();
}
function spawn(){
  const prev = blocks[blocks.length - 1];
  cur = {
    w: prev.w,
    phase: Math.random() * Math.PI * 2,
    speed: 1.6 + score * 0.05,
    range: Math.min(vw * 0.38, 240)
  };
}
function curX(){ return Math.sin(cur.phase + t * cur.speed) * cur.range; }

function drop(){
  if (state === "over"){ reset(); return; }
  hintA = 0;
  const prev = blocks[blocks.length - 1];
  const x = curX();
  const loA = x - cur.w / 2,  hiA = x + cur.w / 2;
  const loB = prev.x - prev.w / 2, hiB = prev.x + prev.w / 2;
  const lo = Math.max(loA, loB), hi = Math.min(hiA, hiB);
  const overlap = hi - lo;
  if (overlap <= 0){
    shards.push({ x: x, w: cur.w, y: blocks.length, py: 0, vy: 0, rot: 0, vr: (Math.random()-0.5)*0.2 });
    state = "over"; shake = 9;
    best = Math.max(best, score);
    return;
  }
  if (Math.abs(x - prev.x) < 5){
    blocks.push({ x: prev.x, w: cur.w });
    flash = 1;
  } else {
    // trimmed piece falls off the uncovered side
    if (loA < lo) shards.push({ x: (loA + lo)/2, w: lo - loA, y: blocks.length, py: 0, vy: 0, rot: 0, vr: -0.12 });
    if (hiA > hi) shards.push({ x: (hi + hiA)/2, w: hiA - hi, y: blocks.length, py: 0, vy: 0, rot: 0, vr: 0.12 });
    blocks.push({ x: (lo + hi)/2, w: overlap });
  }
  score++;
  camTarget = Math.max(0, (blocks.length - 1) * BH - vh * 0.42);
  spawn();
}

addEventListener("pointerdown", drop);
addEventListener("keydown", e => {
  if (e.code === "Space" && !e.repeat){ e.preventDefault(); drop(); }
});

function rr(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function blockColor(i){
  const h = (195 + i * 8) % 360;
  return { fill: `hsl(${h},62%,56%)`, edge: `hsl(${h},62%,40%)` };
}
function drawBlock(cx0, sy, x, w, i){
  const c = blockColor(i);
  ctx.fillStyle = c.edge;
  rr(cx0 + x - w/2, sy + 4, w, BH - 2, 6); ctx.fill();
  ctx.fillStyle = c.fill;
  rr(cx0 + x - w/2, sy, w, BH - 4, 6); ctx.fill();
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  t += dt;
  camY += (camTarget - camY) * Math.min(1, dt * 6);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  // background
  const hueTop = 228 + score * 1.2;
  const g = ctx.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, `hsl(${hueTop},45%,10%)`);
  g.addColorStop(1, `hsl(${hueTop + 40},38%,17%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, vw, vh);

  const cx0 = vw / 2 + (shake > 0 ? (Math.random() - 0.5) * shake : 0);
  const baseY = vh * 0.82;

  // tower
  for (let i = 0; i < blocks.length; i++){
    const sy = baseY - i * BH + camY;
    if (sy > -BH && sy < vh + BH) drawBlock(cx0, sy, blocks[i].x, blocks[i].w, i);
  }
  // falling shards
  for (const s of shards){
    s.vy += dt * 1400; s.py += s.vy * dt; s.rot += s.vr;
    const sy = baseY - s.y * BH + camY + s.py;
    if (sy < vh + 80){
      ctx.save();
      ctx.translate(cx0 + s.x, sy + BH/2);
      ctx.rotate(s.rot);
      const c = blockColor(s.y);
      ctx.fillStyle = c.fill;
      rr(-s.w/2, -BH/2, s.w, BH - 4, 5); ctx.fill();
      ctx.restore();
    }
  }
  // moving block
  if (state === "play"){
    const sy = baseY - blocks.length * BH + camY;
    drawBlock(cx0, sy, curX(), cur.w, blocks.length);
  }
  // perfect flash
  if (flash > 0){
    const topY = baseY - (blocks.length - 1) * BH + camY;
    ctx.strokeStyle = `rgba(255,255,255,${flash * 0.9})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx0 + blocks[blocks.length-1].x, topY + BH/2, 30 + (1 - flash) * 46, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${flash})`;
    ctx.font = "600 15px ui-monospace,monospace";
    ctx.textAlign = "center";
    ctx.fillText("PERFECT", cx0, topY - 16);
  }
  // score
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.font = "700 54px ui-monospace,monospace";
  ctx.textAlign = "center";
  ctx.fillText(String(score), vw / 2, 86);
  // hint
  if (hintA > 0 && state === "play"){
    ctx.fillStyle = `rgba(255,255,255,${0.65 * hintA * (0.6 + 0.4 * Math.sin(t * 4))})`;
    ctx.font = "500 16px ui-monospace,monospace";
    ctx.fillText("tap to drop the block", vw / 2, 124);
  }
  // game over
  if (state === "over"){
    ctx.fillStyle = "rgba(8,10,22,0.72)";
    ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = "#fff";
    ctx.font = "700 30px ui-monospace,monospace";
    ctx.fillText("tower toppled", vw / 2, vh * 0.4);
    ctx.font = "500 18px ui-monospace,monospace";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText(`height ${score}   ·   best ${best}`, vw / 2, vh * 0.4 + 38);
    ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(t * 4)})`;
    ctx.font = "500 16px ui-monospace,monospace";
    ctx.fillText("tap to stack again", vw / 2, vh * 0.4 + 76);
  }
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  if (vw > 0 && vh > 0){ reset(); requestAnimationFrame(frame); }
  else requestAnimationFrame(boot);
}
boot();
</script>
</body>
</html>
