<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>orbit</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a16;user-select:none;-webkit-user-select:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #hud{position:absolute;left:0;right:0;bottom:6vh;text-align:center;color:#7d86a8;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;pointer-events:none}
  #hud b{display:block;font-size:34px;letter-spacing:-.02em;color:#eef1ff;margin-bottom:8px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b id="pct">0%</b><span id="msg">leaving the pad</span></div>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const pct = document.getElementById("pct"), msg = document.getElementById("msg");
let W, H;
function size(){ const d = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", size); size();
const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random()*1.4+.3, tw: Math.random()*6 }));

const KEYS = [[0,0],[2.5,31],[5,55],[7.5,62],[9.5,66],[11.5,86],[13.5,100]];
const DUR = 13.5, HOLD = 3, RESET = 1;
function progressAt(t){
  for (let i = 1; i < KEYS.length; i++){
    const [t0,p0] = KEYS[i-1], [t1,p1] = KEYS[i];
    if (t <= t1){ const u = (t-t0)/(t1-t0); const e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; return p0+(p1-p0)*e; }
  }
  return 100;
}
let start = performance.now()/1000, phase = "load", lastP = 0, speed = 0;
const puffs = [];

let lastNow = performance.now()/1000;
function frame(nowMs){
  const now = nowMs/1000, t = now - start;
  const dt = Math.min(0.05, Math.max(0.001, now - lastNow)); lastNow = now;
  let p, fade = 1;
  if (phase === "load"){ p = progressAt(t); if (t >= DUR){ phase = "hold"; start = now; p = 100; } }
  else if (phase === "hold"){ p = 100; if (t >= HOLD){ phase = "reset"; start = now; } }
  else { p = 100; fade = 1 - t / RESET; if (t >= RESET){ phase = "load"; start = now; p = 0; puffs.length = 0; lastP = 0; } }
  // progress rate in %/s, smoothed — drives the flame length and exhaust
  const rate = Math.max(0, p - lastP) / dt; lastP = p;
  speed += (rate - speed) * Math.min(1, 9 * dt);

  const s = Math.max(.6, Math.min(1.5, Math.min(W, H) / 460));
  const cx = W/2, cy = H/2 - 6*s, R = 150*s, PR = 58*s;
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha = phase === "reset" ? Math.max(0, fade) : 1;
  // stars
  for (const st of stars){
    ctx.fillStyle = `rgba(255,255,255,${.35 + .65*Math.abs(Math.sin(now*1.2 + st.tw))})`;
    ctx.beginPath(); ctx.arc(st.x*W, st.y*H, st.r, 0, 7); ctx.fill();
  }
  // orbit track + progress arc
  ctx.lineWidth = 2*s; ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  const a0 = -Math.PI/2, a = a0 + Math.PI*2*p/100;
  ctx.lineWidth = 5*s; ctx.strokeStyle = "#7cf5ff"; ctx.lineCap = "round";
  ctx.shadowColor = "#7cf5ff"; ctx.shadowBlur = 12*s;
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a); ctx.stroke(); ctx.shadowBlur = 0;
  // planet
  const g = ctx.createRadialGradient(cx - PR*.4, cy - PR*.4, PR*.1, cx, cy, PR);
  g.addColorStop(0, "#9ad0ff"); g.addColorStop(.6, "#3a6fd8"); g.addColorStop(1, "#15306b");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, PR, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(120,220,140,.55)";
  ctx.beginPath(); ctx.ellipse(cx - PR*.25, cy - PR*.1, PR*.42, PR*.26, .5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + PR*.35, cy + PR*.35, PR*.22, PR*.16, -.4, 0, 7); ctx.fill();
  // ring shadow
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 6*s;
  ctx.beginPath(); ctx.ellipse(cx, cy, PR*1.6, PR*.35, -.35, 0, 7); ctx.stroke();

  // rocket: orbit while loading, descend and land during hold
  let rx, ry, heading;
  if (phase === "load" || phase === "reset"){
    rx = cx + Math.cos(a)*R; ry = cy + Math.sin(a)*R; heading = a + Math.PI/2;
  } else {
    const u = Math.min(1, t / 1.6), e = 1 - Math.pow(1-u, 3);
    const rr = R - (R - PR - 10*s) * e;
    rx = cx + Math.cos(a)*rr; ry = cy + Math.sin(a)*rr; heading = a + Math.PI/2 + (Math.PI/2) * e;
  }
  // exhaust puffs
  if (phase === "load" && speed > 1.2 && Math.random() < 60 * dt){
    puffs.push({ x: rx - Math.cos(heading)*14*s, y: ry - Math.sin(heading)*14*s, r: 3*s, a: .8 });
  }
  for (let i = puffs.length-1; i >= 0; i--){
    const q = puffs[i]; q.r += 10*s*dt; q.a -= .9*dt;
    if (q.a <= 0) puffs.splice(i,1); else { ctx.fillStyle = `rgba(255,170,80,${q.a})`; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill(); }
  }
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(heading);
  const flame = (phase === "load" ? Math.min(30, 6 + speed * 1.5) : 0) * s * (1 + Math.random()*.3);
  if (flame > 0){
    ctx.fillStyle = "#ffb347"; ctx.beginPath(); ctx.moveTo(-4*s, 10*s); ctx.lineTo(0, 10*s + flame); ctx.lineTo(4*s, 10*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.moveTo(-2*s, 10*s); ctx.lineTo(0, 10*s + flame*.55); ctx.lineTo(2*s, 10*s); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#f4f4f8"; ctx.beginPath(); ctx.moveTo(0, -16*s); ctx.quadraticCurveTo(9*s, -2*s, 7*s, 10*s); ctx.lineTo(-7*s, 10*s); ctx.quadraticCurveTo(-9*s, -2*s, 0, -16*s); ctx.fill();
  ctx.fillStyle = "#ff5c7a"; ctx.beginPath(); ctx.moveTo(-7*s, 10*s); ctx.lineTo(-13*s, 16*s); ctx.lineTo(-6*s, 4*s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7*s, 10*s); ctx.lineTo(13*s, 16*s); ctx.lineTo(6*s, 4*s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#3a6fd8"; ctx.beginPath(); ctx.arc(0, -3*s, 3.2*s, 0, 7); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  pct.textContent = Math.round(p) + "%";
  msg.textContent = phase === "hold" ? (t < 1.6 ? "de-orbit burn" : "touchdown") : phase === "reset" ? "resetting the pad" :
    p < 25 ? "leaving the pad" : p < 58 ? "in orbit" : p < 68 ? "coasting · waiting for the window" : p < 92 ? "burn complete" : "final approach";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
