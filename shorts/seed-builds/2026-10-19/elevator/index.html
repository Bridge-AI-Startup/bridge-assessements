<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>elevator</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#15161a;color:#e9e4d8;user-select:none;-webkit-user-select:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{position:absolute;inset:0;display:grid;place-items:center}
  #frame{position:relative;width:min(78vw,300px);aspect-ratio:3/4.4;background:#2a2b31;border-radius:14px;
    box-shadow:0 0 0 6px #1c1d22,0 30px 60px rgba(0,0,0,.5);padding:16px 16px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
  #panel{background:#0b0c0f;border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:inset 0 0 0 2px #35363d}
  #floor{font-size:44px;font-weight:600;color:#ff8a3d;text-shadow:0 0 14px rgba(255,138,61,.6);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #arrow{font-size:22px;color:#ff8a3d;opacity:.9;text-shadow:0 0 10px rgba(255,138,61,.6)}
  #doors{position:relative;flex:1;border-radius:8px;overflow:hidden;background:#0b0c0f;box-shadow:inset 0 0 0 2px #35363d}
  #shaft{position:absolute;inset:0;background:
    repeating-linear-gradient(to bottom,transparent 0 56px,rgba(255,255,255,.08) 56px 60px),
    linear-gradient(#1b1c21,#121317)}
  #room{position:absolute;inset:0;display:grid;place-items:center;background:#f3ead8;color:#4a3b2a;text-align:center;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:0;transition:opacity .4s}
  #room b{display:block;font-size:20px;letter-spacing:-.01em;margin-bottom:6px;color:#2b2218}
  .door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#8e8e96,#b9b9c2 40%,#8e8e96);
    transition:transform 1.1s cubic-bezier(.65,0,.3,1)}
  .door::after{content:"";position:absolute;top:0;bottom:0;width:3px;background:#3c3d44}
  #dl{left:0}#dl::after{right:0}#dr{right:0}#dr::after{left:0}
  #frame.open #dl{transform:translateX(-100%)}#frame.open #dr{transform:translateX(100%)}
  #frame.open #room{opacity:1}
  #buttons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .btn{aspect-ratio:1;border-radius:50%;background:#1a1b20;box-shadow:inset 0 0 0 2px #3a3b43;display:grid;place-items:center;
    font-size:10px;color:#6b6c75;transition:background .25s,color .25s,box-shadow .25s}
  .btn.lit{background:#ff8a3d;color:#1a1b20;box-shadow:0 0 12px rgba(255,138,61,.7)}
  #hud{position:absolute;left:0;right:0;bottom:5vh;text-align:center;color:#8b8c96;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  #ding{position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 0 #ffd166;opacity:0;pointer-events:none}
  #frame.open #ding{animation:ding .9s ease-out}
  @keyframes ding{0%{opacity:1;box-shadow:inset 0 0 0 10px #ffd166}100%{opacity:0;box-shadow:inset 0 0 0 0 #ffd166}}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <div id="panel"><span id="floor">L</span><span id="arrow">▲</span></div>
    <div id="doors">
      <div id="shaft"></div>
      <div id="room"><div><b>Floor 12</b>you're here · doors closing</div></div>
      <div class="door" id="dl"></div><div class="door" id="dr"></div>
      <div id="ding"></div>
    </div>
    <div id="buttons"></div>
  </div>
</div>
<div id="hud">going up · 0%</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const frameEl = $("frame"), floorEl = $("floor"), arrow = $("arrow"), shaft = $("shaft"), hud = $("hud"), buttons = $("buttons");
const FLOORS = 12;
const btns = [];
for (let i = 1; i <= FLOORS; i++){
  const b = document.createElement("div"); b.className = "btn"; b.textContent = i; buttons.appendChild(b); btns.push(b);
}

// Elevators are honest about stalling: it sits at 7 for a while.
const KEYS = [[0,0],[2.5,30],[5,52],[7.5,58],[9.5,60],[11.5,82],[13.5,100]];
const DUR = 13.5, HOLD = 3.2, RESET = 1.3;
function progressAt(t){
  for (let i = 1; i < KEYS.length; i++){
    const [t0,p0] = KEYS[i-1], [t1,p1] = KEYS[i];
    if (t <= t1){ const u = (t-t0)/(t1-t0); const e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; return p0+(p1-p0)*e; }
  }
  return 100;
}

let start = performance.now() / 1000, phase = "load", lastP = 0;
let lastNow = performance.now() / 1000;
function frame(nowMs){
  const now = nowMs / 1000, t = now - start;
  const dt = Math.min(0.05, Math.max(0.001, now - lastNow)); lastNow = now;
  let p;
  if (phase === "load"){ p = progressAt(t); if (t >= DUR){ phase = "hold"; start = now; p = 100; frameEl.classList.add("open"); } }
  else if (phase === "hold"){ p = 100; if (t >= HOLD){ phase = "reset"; start = now; frameEl.classList.remove("open"); } }
  else { p = 100; if (t >= RESET){ phase = "load"; start = now; p = 0; } }

  const floor = Math.max(1, Math.min(FLOORS, 1 + Math.floor(p / 100 * FLOORS * 0.9999)));
  floorEl.textContent = phase === "reset" ? "L" : (p < 1 ? "L" : floor);
  // Shaft lines scroll with progress, so a stall reads as a stuck car.
  shaft.style.backgroundPositionY = `${(phase === "reset" ? 0 : p) * 9}px`;
  const moving = Math.abs(p - lastP) / dt > 1.2; lastP = p;
  arrow.style.opacity = phase === "load" && moving ? (Math.sin(now * 8) > 0 ? 1 : .35) : .25;
  btns.forEach((b, i) => b.classList.toggle("lit", phase !== "reset" && floor >= i + 1 && p >= 1));
  hud.textContent =
    phase === "hold" ? "arrived · 100%" : phase === "reset" ? "returning to lobby" :
    p >= 56 && p <= 62 ? "stuck between 7 and 8 · " + Math.round(p) + "%" : "going up · " + Math.round(p) + "%";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
