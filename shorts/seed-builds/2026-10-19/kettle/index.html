<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kettle</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3ebdd;user-select:none;-webkit-user-select:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #hud{position:absolute;left:0;right:0;bottom:7vh;text-align:center;color:#8a6a45;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
  #hud b{display:block;font-size:36px;letter-spacing:-.02em;color:#3b2a18;margin-bottom:8px;font-weight:600;
    font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b id="pct">18°</b><span id="msg">filling the kettle</span></div>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const pct = document.getElementById("pct"), msg = document.getElementById("msg");
let W, H;
function size(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", size); size();

// Fake loading with a real-feeling shape: quick start, a long stall around
// 70, then a burst to the boil.
const KEYS = [[0,0],[2.5,34],[5,58],[8,67],[10.5,71],[12,88],[13.5,100]];
const DUR = 13.5, HOLD = 2.6, RESET = 0.9;
function progressAt(t){
  for (let i = 1; i < KEYS.length; i++){
    const [t0,p0] = KEYS[i-1], [t1,p1] = KEYS[i];
    if (t <= t1){
      const u = (t - t0) / (t1 - t0);
      const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
      return p0 + (p1 - p0) * e;
    }
  }
  return 100;
}

const bubbles = [], steam = [];
let start = performance.now() / 1000, phase = "load";

function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

let lastNow = performance.now() / 1000;
function frame(nowMs){
  const now = nowMs / 1000, t = now - start;
  const dt = Math.min(0.05, Math.max(0.001, now - lastNow)); lastNow = now;
  let p;
  if (phase === "load"){ p = progressAt(t); if (t >= DUR){ phase = "hold"; start = now; p = 100; } }
  else if (phase === "hold"){ p = 100; if (t >= HOLD){ phase = "reset"; start = now; } }
  else { p = 100 * (1 - Math.min(1, t / RESET)); if (t >= RESET){ phase = "load"; start = now; bubbles.length = 0; steam.length = 0; p = 0; } }
  draw(p, t, now, dt);
  requestAnimationFrame(frame);
}

function draw(p, t, now, dt){
  ctx.clearRect(0, 0, W, H);
  const s = Math.max(.65, Math.min(1.5, Math.min(W, H) / 440));
  const cx = W / 2, cy = H / 2 + 10 * s;
  const bw = 230 * s, bh = 160 * s, bx = cx - bw / 2, by = cy - bh / 2;
  const heat = p / 100;
  const hop = phase === "hold" ? Math.abs(Math.sin(t * 18)) * 6 * s * Math.max(0, 1 - t / HOLD) : 0;

  // stove ring + heat glow
  ctx.fillStyle = "#2b241e"; rr(cx - 150*s, by + bh - 6*s, 300*s, 22*s, 8*s); ctx.fill();
  ctx.fillStyle = `rgba(255,${Math.round(130 - 70*heat)},40,${0.12 + 0.6*heat})`;
  rr(cx - 120*s, by + bh + 1*s, 240*s, 8*s, 4*s); ctx.fill();

  ctx.save(); ctx.translate(0, -hop);
  // handle
  ctx.lineWidth = 12*s; ctx.strokeStyle = "#2b241e"; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(cx, by + 6*s, 70*s, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
  // spout
  ctx.fillStyle = "#d9c9a8";
  ctx.beginPath();
  ctx.moveTo(bx + bw - 10*s, by + 40*s); ctx.lineTo(bx + bw + 58*s, by - 14*s);
  ctx.lineTo(bx + bw + 74*s, by + 4*s);  ctx.lineTo(bx + bw - 10*s, by + 92*s);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 5*s; ctx.strokeStyle = "#2b241e"; ctx.stroke();
  // body
  rr(bx, by, bw, bh, 34*s); ctx.fillStyle = "#e8dbbd"; ctx.fill();
  // water, clipped to the body
  ctx.save(); rr(bx, by, bw, bh, 34*s); ctx.clip();
  const lvl = by + bh - bh * p / 100;
  ctx.fillStyle = "#7fb6d6";
  ctx.beginPath(); ctx.moveTo(bx, lvl);
  for (let x = bx; x <= bx + bw + 6; x += 6)
    ctx.lineTo(x, lvl + Math.sin(x / (18*s) + now * 3) * 2.2 * s * (0.3 + heat));
  ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx, by + bh); ctx.closePath(); ctx.fill();
  if (phase !== "reset" && Math.random() < heat * 54 * dt)
    bubbles.push({ x: bx + 20*s + Math.random() * (bw - 40*s), y: by + bh - 4*s,
      r: (1.5 + Math.random() * 3) * s, v: (20 + Math.random() * 60) * s * (0.4 + heat) });
  ctx.fillStyle = "rgba(255,255,255,.78)";
  for (let i = bubbles.length - 1; i >= 0; i--){
    const b = bubbles[i]; b.y -= b.v * dt; b.x += Math.sin(now * 6 + b.r) * 18 * dt;
    if (b.y < lvl + 3) bubbles.splice(i, 1);
    else { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
  }
  ctx.restore();
  // outline + lid + knob
  ctx.lineWidth = 5*s; ctx.strokeStyle = "#2b241e"; rr(bx, by, bw, bh, 34*s); ctx.stroke();
  ctx.fillStyle = "#2b241e";
  ctx.beginPath(); ctx.ellipse(cx, by, 52*s, 12*s, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, by - 12*s, 8*s, 0, 7); ctx.fill();
  ctx.restore();

  // steam from the spout once it is properly hot
  if (phase !== "reset" && p > 62 && Math.random() < (p - 62) / 40 * 60 * dt)
    steam.push({ x: bx + bw + 66*s, y: by - 8*s, r: (6 + Math.random() * 8) * s, a: .5,
      vx: (8 + Math.random() * 14) * s, vy: -(28 + Math.random() * 30) * s });
  for (let i = steam.length - 1; i >= 0; i--){
    const q = steam[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.r += 14*s * dt; q.a -= .35 * dt;
    if (q.a <= 0) steam.splice(i, 1);
    else { ctx.fillStyle = `rgba(150,160,172,${q.a})`; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  }

  const deg = Math.round(18 + 82 * p / 100);
  pct.textContent = deg + "°";
  msg.textContent =
    phase === "hold" ? "boiling · tea's up" :
    phase === "reset" ? "fresh pot" :
    p < 30 ? "filling the kettle" : p < 62 ? "heating up" : p < 90 ? "that bit where nothing happens" : "nearly there";
}
requestAnimationFrame(frame);
</script>
</body>
</html>
