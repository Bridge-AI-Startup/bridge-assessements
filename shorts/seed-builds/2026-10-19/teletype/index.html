<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>teletype</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1a12;color:#9ef0b3;user-select:none;-webkit-user-select:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #term{position:absolute;inset:0;padding:clamp(16px,5vw,48px);box-sizing:border-box;font-size:clamp(12px,2.6vw,16px);line-height:1.7;
    white-space:pre-wrap;word-break:break-word;text-shadow:0 0 6px rgba(158,240,179,.45)}
  #term::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.14) 3px 4px)}
  .dim{color:#5f9a70}
  .ok{color:#f6e27a}
  #caret{display:inline-block;width:.6em;height:1.1em;background:#9ef0b3;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="term"></div>
<script>
"use strict";
const term = document.getElementById("term");
const LINES = [
  [0,   "booting the loading screen"],
  [8,   "warming up the pixels"],
  [18,  "asking the hamsters to run faster"],
  [30,  "untangling the cables"],
  [42,  "counting to one hundred, slowly"],
  [55,  "downloading more download"],
  [58,  "re-reading the instructions"],
  [64,  "ok. actually loading now"],
  [78,  "polishing the progress bar"],
  [90,  "pretending to check something"],
  [100, "done. you can stop reading now."],
];
const KEYS = [[0,0],[2.5,33],[5,55],[7.5,59],[9.5,62],[11.5,86],[13.5,100]];
const DUR = 13.5, HOLD = 3.2, RESET = .6;
function progressAt(t){
  for (let i = 1; i < KEYS.length; i++){
    const [t0,p0] = KEYS[i-1], [t1,p1] = KEYS[i];
    if (t <= t1){ const u = (t-t0)/(t1-t0); const e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; return p0+(p1-p0)*e; }
  }
  return 100;
}
function bar(p){ const n = 24, f = Math.round(n * p / 100); return "[" + "█".repeat(f) + "░".repeat(n - f) + "] " + String(Math.round(p)).padStart(3) + "%"; }

let start = performance.now()/1000, phase = "load", typedChars = 0, lineIdx = -1, done = [];
let lastNow = performance.now()/1000;
function frame(nowMs){
  const now = nowMs/1000, t = now - start;
  const dt = Math.min(0.05, Math.max(0.001, now - lastNow)); lastNow = now;
  let p;
  if (phase === "load"){ p = progressAt(t); if (t >= DUR){ phase = "hold"; start = now; p = 100; } }
  else if (phase === "hold"){ p = 100; if (t >= HOLD){ phase = "reset"; start = now; } }
  else { p = 100; if (t >= RESET){ phase = "load"; start = now; p = 0; typedChars = 0; lineIdx = -1; done = []; } }

  // advance to the latest line whose threshold we've crossed; type it out
  let target = -1;
  for (let i = 0; i < LINES.length; i++) if (p >= LINES[i][0]) target = i;
  if (phase === "reset") target = -1;
  if (target > lineIdx){
    // a progress jump can cross several thresholds in one frame — every
    // line we skipped still gets its "ok" so the log reads whole
    for (let i = Math.max(0, lineIdx); i < target; i++) done.push(LINES[i][1]);
    lineIdx = target; typedChars = 0;
  }
  if (lineIdx >= 0) typedChars = Math.min(LINES[lineIdx][1].length, typedChars + 33 * dt);

  const out = [];
  out.push(`<span class="dim">bridge-shorts ~ % load --please</span>`);
  for (const l of done) out.push(`<span class="dim">></span> ${l} <span class="ok">ok</span>`);
  if (lineIdx >= 0){
    const cur = LINES[lineIdx][1].slice(0, Math.floor(typedChars));
    const full = Math.floor(typedChars) >= LINES[lineIdx][1].length;
    out.push(`<span class="dim">></span> ${cur}${full && phase === "hold" ? "" : "<span id=caret></span>"}`);
  } else if (phase === "reset") out.push(`<span class="dim">clear</span>`);
  out.push("");
  out.push(phase === "reset" ? "" : bar(p));
  if (phase === "hold") out.push(`\n<span class="ok">exit 0</span> <span id="caret"></span>`);
  term.innerHTML = out.join("\n");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
