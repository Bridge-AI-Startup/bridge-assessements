<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal Fade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #050505;
    color: #d8ffd8;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .panel {
    width: min(92vw, 480px);
    border: 1px solid rgba(216,255,216,.2);
    border-radius: 12px;
    padding: 1.4rem 1.4rem 1.2rem;
    background: linear-gradient(180deg, #0c120c, #050805);
    box-shadow: 0 0 40px rgba(80,255,120,.06);
  }
  .hdr {
    display: flex;
    justify-content: space-between;
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .55;
    margin-bottom: 1rem;
  }
  .scope {
    position: relative;
    height: 160px;
    border: 1px solid rgba(216,255,216,.15);
    border-radius: 6px;
    overflow: hidden;
    background: #030603;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .readout {
    margin-top: 1.1rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .8rem;
  }
  .box {
    border: 1px solid rgba(216,255,216,.15);
    border-radius: 6px;
    padding: .8rem;
  }
  .k { font-size: .65rem; opacity: .5; letter-spacing: .14em; text-transform: uppercase; }
  .v { margin-top: .35rem; font-size: 1.4rem; letter-spacing: .08em; }
  .bars {
    margin-top: 1rem;
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 48px;
  }
  .bar {
    flex: 1;
    background: rgba(216,255,216,.15);
    border-radius: 2px 2px 0 0;
    transition: height .3s, background .3s;
  }
  .bar.hot { background: #7dff9a; box-shadow: 0 0 10px rgba(125,255,154,.4); }
  .msg {
    margin-top: .9rem;
    font-size: .78rem;
    opacity: .65;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="hdr"><span>RX / TIMEBASE</span><span id="blink">● LIVE</span></div>
    <div class="scope"><canvas id="c" width="900" height="320"></canvas></div>
    <div class="readout">
      <div class="box"><div class="k">Local time</div><div class="v" id="time">00:00:00</div></div>
      <div class="box"><div class="k">Day progress</div><div class="v" id="prog">00.0%</div></div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="msg" id="msg">Calibrating carrier…</div>
  </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const barsEl = document.getElementById('bars');
const bars = [];
for (let i = 0; i < 24; i++) {
  const b = document.createElement('div');
  b.className = 'bar';
  barsEl.appendChild(b);
  bars.push(b);
}

let phase = 0;
function wave(now) {
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
  const t = h + m/60 + s/3600;
  // frequency rises through the day; amplitude dips at night
  const freq = 1.5 + t / 6;
  const amp = 0.25 + 0.55 * Math.sin((t / 24) * Math.PI);
  phase += 0.08 + freq * 0.01;

  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(3,6,3,.35)';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(125,255,154,.15)';
  ctx.beginPath();
  ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

  ctx.strokeStyle = '#7dff9a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const y = H/2 + Math.sin(x * 0.02 * freq + phase) * (H * 0.35 * amp)
      + Math.sin(x * 0.05 + phase * 1.7) * 8;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // second blip
  const x = ((s + ms/1000) / 60) * W;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x, H/2 + Math.sin(x * 0.02 * freq + phase) * (H * 0.35 * amp), 4, 0, Math.PI*2);
  ctx.fill();
}

function msg(h) {
  if (h < 6) return 'Carrier weak — overnight noise floor.';
  if (h < 10) return 'Signal climbing with the morning.';
  if (h < 16) return 'Strong mid-day carrier. Clean trace.';
  if (h < 20) return 'Afternoon fade beginning on the edges.';
  return 'Night band. Narrow pulses only.';
}

function tick() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  wave(now);
  document.getElementById('time').textContent = [h,m,s].map(n => String(n).padStart(2,'0')).join(':');
  const pct = ((h*3600 + m*60 + s) / 86400) * 100;
  document.getElementById('prog').textContent = pct.toFixed(1) + '%';
  document.getElementById('msg').textContent = msg(h);
  document.getElementById('blink').style.opacity = s % 2 ? '1' : '.35';
  bars.forEach((b, i) => {
    const height = i <= h ? 18 + (i === h ? (m/60)*30 : 30) : 8;
    b.style.height = height + 'px';
    b.classList.toggle('hot', i === h);
  });
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
