<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sandglass Day</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #1a1410;
    color: #f3e6d0;
    font-family: "Source Serif 4", Georgia, serif;
  }
  .wrap { width: min(92vw, 420px); text-align: center; }
  h1 {
    font-weight: 400;
    font-size: 1rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(243,230,208,.55);
    margin-bottom: 1.25rem;
  }
  .glass {
    position: relative;
    margin: 0 auto;
    width: 220px;
    height: 340px;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .time {
    margin-top: 1.25rem;
    font-size: 2.6rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: .06em;
  }
  .meta {
    margin-top: .4rem;
    font-size: .95rem;
    color: rgba(243,230,208,.6);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Day draining</h1>
    <div class="glass"><canvas id="c" width="440" height="680"></canvas></div>
    <div class="time" id="time">00:00</div>
    <div class="meta" id="meta">of the day left</div>
  </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function hourglassPath(g) {
  g.beginPath();
  g.moveTo(80, 40); g.lineTo(360, 40); g.lineTo(230, 340); g.lineTo(360, 640); g.lineTo(80, 640); g.lineTo(210, 340); g.closePath();
}

function draw(fracGone) {
  ctx.clearRect(0, 0, W, H);
  // frame
  ctx.save();
  hourglassPath(ctx);
  ctx.strokeStyle = 'rgba(243,230,208,.35)';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  hourglassPath(ctx);
  ctx.clip();

  const topFill = 1 - fracGone; // remaining in top
  const botFill = fracGone;

  // top sand
  const topBottom = 40 + (300 * (1 - topFill));
  ctx.fillStyle = '#c4a574';
  ctx.fillRect(80, topBottom, 280, 300 - (topBottom - 40));

  // bottom sand
  const botHeight = 280 * botFill;
  ctx.fillRect(80, 640 - botHeight, 280, botHeight);

  // falling stream
  if (fracGone > 0.01 && fracGone < 0.99) {
    ctx.fillStyle = 'rgba(196,165,116,.85)';
    ctx.fillRect(216, 320, 8, 40);
  }
  ctx.restore();

  // neck highlight
  ctx.fillStyle = 'rgba(255,220,160,.08)';
  ctx.beginPath();
  ctx.moveTo(200, 300); ctx.lineTo(240, 300); ctx.lineTo(230, 340); ctx.lineTo(210, 340);
  ctx.fill();
}

function tick() {
  const now = new Date();
  const seconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
  const fracGone = seconds / 86400;
  draw(fracGone);
  const leftH = Math.floor((86400 - seconds) / 3600);
  const leftM = Math.floor(((86400 - seconds) % 3600) / 60);
  document.getElementById('time').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('meta').textContent =
    leftH + 'h ' + leftM + 'm of the day left · ' + Math.round((1 - fracGone) * 100) + '%';
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
